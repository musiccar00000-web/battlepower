<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>かわいさスカウター</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
<div class="titleRow">
  <h1 class="title">
    かわいさ<span class="accent">スカウター</span>
  </h1>
  <div class="chip">LOCAL AI</div>
</div>
      </div>
      <p class="sub">
        ※画像はこの端末内で解析（外部送信しません）。本人の同意がある画像のみ使用してください。
      </p>
    </header>

    <section class="panel">
      <div class="controls">
        <label class="fileBtn">
          <input id="file" type="file" accept="image/*" />
          画像を選択
        </label>

        <button id="scan" class="scanBtn" disabled>スキャン開始</button>

        <div class="statusBox">
          <div class="statusLabel">状態</div>
          <div id="status" class="statusText">モデル読み込み中…</div>
        </div>
      </div>

      <div class="meterWrap">
        <div class="meterHead">
          <div class="meterTitle">かわいさメーター</div>
          <div id="meterValue" class="meterValue">---</div>
        </div>

        <div class="meter">
          <div class="meterBar">
            <div id="meterFill" class="meterFill"></div>
            <div class="meterTicks"></div>
          </div>
          <div id="meterNeedle" class="meterNeedle"></div>
        </div>

        <div class="resultRow">
          <div class="resultLabel">推定スコア</div>
          <div class="resultValue"><span id="power">---</span><span class="unit">pt</span></div>
        </div>

        <div class="facts">
          <div class="factsTitle">根拠（幾何学）</div>
          <div id="detail" class="factsBody">画像を選択してください</div>
          <div class="factsNote">
            ※「対称性」「比率」「中心ズレ」などの形状指標から算出（主観ではなく幾何学）。
          </div>
        </div>
      </div>
    </section>

    <section class="panel canvasPanel">
      <div class="canvasTop">
        <div class="canvasTitle">スキャンビュー</div>
        <div class="hint">顔が正面に近いほど安定します</div>
      </div>
      <div class="canvasFrame">
        <canvas id="canvas"></canvas>
        <div class="scanLine"></div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
